name: parity
description: "Offline Android app that compares a physical assembly to its written specification."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Approved dependency set. Nothing is added here without team approval
  # (CLAUDE.md section 10).
  image_picker: ^1.1.2                    # camera capture
  google_mlkit_text_recognition: ^0.15.0  # on-device OCR, Latin script
  path_provider: ^2.1.5                   # app documents directory

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled sample images for the "Run Demo Sample" fallback path (no new
  # package -- just declaring existing PNGs as assets). Two uses: lets the
  # presenter run the full pipeline on stage without depending on live
  # camera/lighting (CLAUDE.md section 21's "recorded backup demo"
  # requirement), and gives a repeatable way to exercise the real on-device
  # ML Kit text recognizer with zero picker/permission involvement.
  assets:
    - demo_assets/demo_spec_A.png
    - demo_assets/demo_assembly_A_match.png
    - demo_assets/demo_assembly_B_tampered.png
